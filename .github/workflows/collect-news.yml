
name: Collect and Deploy Pulse News

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pulse-news
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f scripts/collect_feeds.py || {
            echo "::error::Missing scripts/collect_feeds.py"
            exit 1
          }
          test -f index.html || {
            echo "::error::Missing index.html"
            exit 1
          }
          test -f feeds.json || {
            echo "::error::Missing feeds.json"
            exit 1
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Collect news
        run: python scripts/collect_feeds.py

      - name: Validate generated news data
        run: |
          python -c "import json; json.load(open('data/news.json', encoding='utf-8'))"

      - name: Commit updated news data
        run: |
          if ! git diff --quiet -- data/news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "Update collected news"
            git push
          else
            echo "News data has not changed."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
